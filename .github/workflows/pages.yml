name: Deploy the lite edition to GitHub Pages

# The lite edition never contains StatsBomb or Metrica data: it is built from CC0 / openly licensed files only,
# fetched here in CI. See scripts/build_pages.py, which also refuses to publish row-level files.
on:
  push:
    branches: [main]
    # Only what the lite build reads: README, Space, licence or local-only tooling changes do not change the published site.
    # Run it by hand (workflow_dispatch) after adding a new build input here.
    paths:
      - the_beautiful_data.py
      - head.html
      - public/**
      - scripts/_progress.py
      - scripts/download_data.py
      - scripts/prepare_data.py
      - scripts/build_pages.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_NO_DEV: "1"  # Playwright is only needed for scripts/make_snapshots.py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen --no-dev
      - name: Install ffmpeg (audio and video demos)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Fetch open data only
        env:
          FOOTBALL_USER_AGENT: football-notebook/1.0 (${{ github.server_url }}/${{ github.repository }})
        run: uv run python scripts/download_data.py --open-only
      - name: Prepare the open files
        run: uv run python scripts/prepare_data.py international transfermarkt media
      # Two builds of the same lite notebook:
      #  * the static copy (pre-rendered on the server) opens instantly and is what visitors land on;
      #  * the WebAssembly build is fully interactive but has to download and boot Python in the browser (minutes), so it lives under /live/.
      - name: Build the static copy (instant)
        run: uv run python scripts/build_pages.py --out _static --html
      - name: Build the interactive WebAssembly site
        run: uv run python scripts/build_pages.py --out _site/live
      - name: Assemble the site
        run: cp _static/index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
