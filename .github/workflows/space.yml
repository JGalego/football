name: Sync to the Hugging Face Space

# Pushes this repository (tracked files only: no third-party row-level data) to the Space.
# The Space's Dockerfile then downloads the data inside the image build.
# Needs a repository secret HF_TOKEN (a Hugging Face token with write access to the Space).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: jgalego/football
        run: |
          cp deploy/space/README.md README.md
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add README.md
          git commit -m "Use the Space README" || true
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
