name: Sync to the Hugging Face Space

# Uploads this repository (tracked files, plus the processed Wikimedia media built below; no third-party row-level data) to the Space.
# The Space's Dockerfile then downloads the data inside the image build.
# Needs a repository secret HF_TOKEN (a Hugging Face token with write access to the Space).
on:
  push:
    branches: [main]
    # The Space mirrors the tree, so skip only files it never uses: the GitHub README (the Space gets deploy/space/README.md),
    # the README's images and the Pages workflow.
    paths-ignore:
      - README.md
      - assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

# Each sync uploads the whole tree, so one queued run after the current one is enough; never cut an upload short.
concurrency:
  group: space
  cancel-in-progress: false

jobs:
  sync:
    # The Space name and HF_TOKEN belong to this repository, so forks skip the sync.
    if: github.repository == 'JGalego/football'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Wikimedia throttles (HTTP 429) the servers that build Hugging Face Spaces, so the Space build stalled on the photo/audio/video
      # downloads. GitHub's runners are not throttled (the Pages workflow does the same): build the finished files here and ship them
      # with the code. The Space's Dockerfile then skips Wikimedia when public/media is already complete.
      - uses: astral-sh/setup-uv@v5
      - name: Build the Wikimedia media files
        env:
          UV_NO_DEV: "1"
          FOOTBALL_USER_AGENT: football-notebook/1.0 (${{ github.server_url }}/${{ github.repository }})
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          uv sync --frozen --no-dev
          uv run python scripts/download_data.py --open-only
          uv run python scripts/prepare_data.py media
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: jgalego/football
        run: |
          # Upload the files through the Hugging Face API instead of `git push`: the Hub rejects plain-git binary files
          # (jpg, gz, ...) and the API stores them through Xet for us. `--delete "*"` makes the Space mirror this tree.
          pip install --quiet "huggingface_hub[hf_xet]"
          cp deploy/space/README.md README.md
          hf upload "$HF_SPACE" . . --repo-type space \
            --exclude ".git/*" --exclude ".github/*" --exclude "assets/*" --exclude ".venv/*" --exclude "data/*" --exclude "**/__pycache__/*" \
            --delete "*" \
            --commit-message "Sync from GitHub ${GITHUB_SHA::7}"
